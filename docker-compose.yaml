# Crab Age MLOps stack. Start everything with:   docker compose up
#
#   postgres  MLflow backend store + separate "monitoring" database (prediction log)
#   mlflow    tracking server + model registry; artifacts on a volume (--serve-artifacts)
#   init      one-shot: dvc pull from the public GitHub remote, first training if no champion
#   api       FastAPI: /token /health /version /train /predict
#   dashboard Streamlit + Evidently data drift report (training data vs. logged requests)
#
# URLs from the host:  API http://localhost:8000/docs   MLflow http://localhost:5500
#                      Dashboard http://localhost:8501
# Containers reach each other by service name (postgres:5432, mlflow:5000), never 127.0.0.1.
#
# Every variable has a working LOCAL DEVELOPMENT default, so no .env or secrets file
# is needed. Override them via environment variables or a .env file for any real use.
#
# Stop: docker compose down        Reset everything (volumes too): docker compose down -v

name: crab-age

x-db: &db
  POSTGRES_USER: ${POSTGRES_USER:-crab}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-crab-dev-postgres-password}

x-mlflow-client: &mlflow-client
  MLFLOW_TRACKING_URI: http://mlflow:5000
  MLFLOW_DISABLE_AGENT_HINT: "1"

x-app-build: &app-build
  context: .
  dockerfile: Dockerfile
  args:
    GIT_SHA: ${GIT_SHA:-unknown}

services:
  postgres:
    image: postgres:16.11-alpine
    environment:
      <<: *db
      POSTGRES_DB: mlflow
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./docker/postgres/init-monitoring.sql:/docker-entrypoint-initdb.d/10-monitoring.sql:ro
    healthcheck:
      # TCP check: during the first-run init scripts Postgres only listens on the unix socket.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d monitoring"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow.Dockerfile
    image: crab-age-mlflow:local
    environment:
      <<: *db
    command:
      - mlflow
      - server
      - --host=0.0.0.0
      - --port=5000
      - --workers=2
      - --backend-store-uri=postgresql+psycopg://${POSTGRES_USER:-crab}:${POSTGRES_PASSWORD:-crab-dev-postgres-password}@postgres:5432/mlflow
      - --artifacts-destination=/mlartifacts
      - --serve-artifacts
      # DNS rebinding protection: only these Host headers are accepted.
      - --allowed-hosts=mlflow:5000,mlflow,localhost:5500,localhost,127.0.0.1:5500,127.0.0.1
    volumes:
      - mlflow-artifacts:/mlartifacts
    ports:
      - "5500:5000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  init:
    build:
      <<: *app-build
      target: init
    image: crab-age-init:local
    environment:
      <<: *mlflow-client
    volumes:
      - crab-data:/app/data/processed
    depends_on:
      mlflow:
        condition: service_healthy
    restart: "no"

  api:
    build:
      <<: *app-build
      target: runtime
    image: crab-age-api:local
    environment:
      <<: *mlflow-client
      CRAB_API_USERNAME: ${CRAB_API_USERNAME:-crab}
      # Argon2 hash of the dev password "crab-dev-password" ($ is written as $$ in compose).
      CRAB_API_PASSWORD_HASH: ${CRAB_API_PASSWORD_HASH:-$$argon2id$$v=19$$m=65536,t=3,p=4$$g94xZrs0KRGg/fIokaUxCA$$C524F2TpFI77uysA+wA1zQ5vZrTC4vU4v45ZaYPOSYo}
      CRAB_JWT_SECRET_KEY: ${CRAB_JWT_SECRET_KEY:-local-dev-only-jwt-signing-key-override-with-env-var-for-any-real-use}
      CRAB_MONITORING_DB_URL: postgresql+psycopg://${POSTGRES_USER:-crab}:${POSTGRES_PASSWORD:-crab-dev-postgres-password}@postgres:5432/monitoring
      CRAB_INFERENCE_BATCH_SIZE: ${CRAB_INFERENCE_BATCH_SIZE:-10}
    volumes:
      - crab-data:/app/data/processed
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    restart: unless-stopped

  dashboard:
    build:
      <<: *app-build
      target: runtime
    image: crab-age-api:local
    command:
      - streamlit
      - run
      - dashboard/app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
      - --browser.gatherUsageStats=false
      - --client.toolbarMode=viewer
    environment:
      CRAB_MONITORING_DB_URL: postgresql+psycopg://${POSTGRES_USER:-crab}:${POSTGRES_PASSWORD:-crab-dev-postgres-password}@postgres:5432/monitoring
      CRAB_DRIFT_MIN_ROWS: ${CRAB_DRIFT_MIN_ROWS:-30}
      CRAB_DRIFT_WINDOW: ${CRAB_DRIFT_WINDOW:-500}
    volumes:
      - crab-data:/app/data/processed:ro
    ports:
      - "8501:8501"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 6
    depends_on:
      postgres:
        condition: service_healthy
      init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pg-data:
  mlflow-artifacts:
  crab-data:

prepare:
  raw_path: data/raw/CrabAgePrediction.csv
  out_dir: data/processed
  report_path: metrics/prepare.json
  # Rows above this Height / Diameter ratio are measurement errors (typical: 0.34).
  max_height_to_diameter: 0.8
  test_size: 0.2
  random_state: 42

train:
  train_path: data/processed/train.csv
  test_path: data/processed/test.csv
  experiment_name: crab-age
  registered_model_name: crab-age
  gate:
    # Acceptance gate: the challenger must not be worse than the champion
    # and its test MAE (months) must stay below this absolute limit.
    max_mae: 2.0
  search:
    # Every model type gets its own randomized search; the best CV MAE wins.
    cv_folds: 5
    n_iter: 10
    random_state: 42
    models:
      ridge:
        alpha: [0.01, 0.1, 1.0, 10.0, 100.0]
      random_forest:
        n_estimators: [100, 200, 300]
        max_depth: [null, 6, 10, 16]
        min_samples_leaf: [1, 3, 5, 10]
      hist_gradient_boosting:
        learning_rate: [0.03, 0.05, 0.1]
        max_iter: [100, 200, 400]
        max_leaf_nodes: [15, 31, 63]
        min_samples_leaf: [10, 20, 40]
